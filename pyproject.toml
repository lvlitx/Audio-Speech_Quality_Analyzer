[project]
name = "audio-quality-monitor"
version = "0.1.0"
description = "Real-time audio quality monitoring via UV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sounddevice>=0.4.6",
  "numpy>=1.24.0",
  "librosa>=0.9.0",
  "soundfile>=0.11.0",
  "pesq>=0.0.4",
  "webrtcvad-wheels>=2.0.14",
  # PyTorch audio-quality metrics:
  "torch>=2.0.0",
  "torchmetrics[audio]>=1.0.0",
  "pystoi>=0.2.3",
  # Optional for on-device preprocessing/transforms:
  "torchaudio>=2.0.0",
  "onnxruntime>=1.22.0",
  "transformers>=4.30.0",
  "sentencepiece>=0.1.98",
  "accelerate>=0.20.0",
  "webrtcvad>=2.0.10",
  "faster-whisper>=1.1.1",
  "speechbrain>=1.0.3",
]

[build-system]
requires = ["hatchling", "wheel"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["main.py"]
